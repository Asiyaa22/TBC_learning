<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index Task</title>
    <style>
        .container {
            position: relative;
            width: 300px;
            height: 300px;
            border: 2px solid black;
        }

        .box {
            width: 150px;
            height: 150px;
            position: absolute;
            opacity: 0.8;
        }

        .box1 {
            background-color: red;
            top: 30px;
            left: 30px;
            z-index: 1;
        }

        .box2 {
            background-color: blue;
            top: 50px;
            left: 50px;
            z-index: 2;
        }

        .box3 {
            background-color: green;
            top: 70px;
            left: 70px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
    </div>
</body>
</html>
